version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  target-branch: master
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 20
    commit-message:
      prefix: "deps"
  groups:
    python-packages:
      patterns:
        - "*"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
